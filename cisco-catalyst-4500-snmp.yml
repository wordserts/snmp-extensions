name: "custom:cisco-catalyst-4500-snmp"
version: "1.0.5"
minEECVersion: "1.307.0"
minDynatraceVersion: "1.318.0"
author:
  name: "Custom Extensions Creator App"
vars:
  - id: "ext.activationtag"
    displayName: "Extension activation tag"
    type: "text"
  - id: "if_name"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Name"
    maxLength: 5000
  - id: "if_admin_status"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Admin Status"
    maxLength: 5000
  - id: "if_oper_status"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Operational Status"
    maxLength: 5000
  - id: "if_alias"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Alias"
    maxLength: 5000
  - id: "if_type"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Type"
    maxLength: 5000
metrics:
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.entity_attributes"
    metadata:
      displayName: "Device entity attributes"
      description: "Constant value of 1 used for reporting entity attributes at a
        lower frequency"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.total.1min.rev"
    metadata:
      displayName: "CPU busy"
      description: "Overall CPU busy percentage in the last 1 min."
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.loadavg.1min"
    metadata:
      displayName: "CPU load"
      description: "Overall CPU load average in the last 1 min."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.total.5min.rev"
    metadata:
      displayName: "CPU busy"
      description: "Overall CPU busy percentage in the last 5 min."
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.loadavg.5min"
    metadata:
      displayName: "CPU load"
      description: "Overall CPU load average in the last 5 min."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.memory.hc.used"
    metadata:
      displayName: "CPU memory used"
      description: "Overall CPU wide sys mem currently under use"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.memory.hc.free"
    metadata:
      displayName: "CPU memory free"
      description: "Overall CPU wide sys mem free"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.memory.used"
    metadata:
      displayName: "CPU memory used"
      description: "Overall CPU wide sys mem currently under use (legacy 32-bit value)"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.cpm.cpu.memory.free"
    metadata:
      displayName: "CPU memory free"
      description: "Overall CPU wide sys mem free (legacy 32-bit value)"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.envmon.temperature.stat\
      us.value"
    metadata:
      displayName: "Fan temperature"
      description: "Current temperature of the fan instrumented"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.envmon.fan.state"
    metadata:
      displayName: "Fan state"
      description: "Current state of the fan instrumented"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.snmp.in.pkts.count"
    metadata:
      displayName: "Messages delivered"
      description: "Total number of messages delivered from the transport service"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.snmp.silentdrops.count"
    metadata:
      displayName: "Silently dropped PDUs"
      description: "Number of silently dropped PDUs due to the large reply size"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.snmp.in.bad.versions.co\
      unt"
    metadata:
      displayName: "Unsupported SNMP version messages"
      description: "Total number of messages delivered with an unsupported SNMP version"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.snmp.in.bad.community.n\
      ames.count"
    metadata:
      displayName: "Messages with bad community names"
      description: "Number of messages with an unknown SNMP community"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.snmp.in.bad.community.u\
      ses.count"
    metadata:
      displayName: "Messages not allowed in community"
      description: "Number of messages not allowed for the used SNMP community"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.snmp.in.nosuchnames.cou\
      nt"
    metadata:
      displayName: "'noSuchName' errors"
      description: "Number of PDUs delivered with 'noSuchName' error"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.snmp.in.bad.values.coun\
      t"
    metadata:
      displayName: "'badValue' errors"
      description: "Number of PDUs delivered with 'badValue' error"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.sys.uptime"
    metadata:
      displayName: "Time since the last re-start"
      description: "The time (in hundredths of a second) since the network management
        portion of the system was last re-initialized"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.sys.uptime.millis"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-cisco-device.sys.uptime) * (10)"
    metadata:
      displayName: "Time since the last re-start"
      description: "The time (in milliseconds) since the network management portion of
        the system was last re-initialized"
      unit: "MilliSecond"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.lastchange"
    metadata:
      displayName: "Last interface status change"
      description: "Value of 'sysUpTime' when the interface entered its current state"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.in.octets.count"
    metadata:
      displayName: "Octets received"
      description: "The total number of octets received on the interface including
        framing characters"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.hc.in.octets.count"
    metadata:
      displayName: "Octets received (high capacity)"
      description: "The total number of octets received on the interface including
        framing characters. This metric uses 64 bit counter and should be used
        for highspeed devices."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.in.errors.count"
    metadata:
      displayName: "Inbound errors"
      description: "Number of inbound packets/transmission units with errors"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.in.discards.count"
    metadata:
      displayName: "Inbound discards"
      description: "Number of inbound packets discarded"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.out.octets.count"
    metadata:
      displayName: "Octets transmitted"
      description: "The total number of octets transmitted out of the interface
        including framing characters"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.hc.out.octets.count"
    metadata:
      displayName: "Octets transmitted (high capacity)"
      description: "The total number of octets transmitted out of the interface
        including framing characters. This metric uses 64 bit counter and should
        be used for highspeed devices."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.out.errors.count"
    metadata:
      displayName: "Outbound errors"
      description: "Number of outbound packets/transmission units with errors"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.out.discards.count"
    metadata:
      displayName: "Outbound discards"
      description: "Number of outbound packets discarded"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.in.crc_errors.count"
    metadata:
      displayName: "CRC errors"
      description: "Number of input packets which had cyclic redundancy checksum errors"
      unit: "Count"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.activeopens.count"
    metadata:
      displayName: "TCP active opens"
      description: "Number of transitions of TCP connections from CLOSED to SYN-SENT"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.passiveopens.count"
    metadata:
      displayName: "TCP passive opens"
      description: "Number of transitions of TCP connections from CLOSED to SYN-RCVD"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.attemptfails.count"
    metadata:
      displayName: "TCP failed attempts"
      description: "Number of transitions of TCP connections from SYN-SENT/SYN-RCVD to
        CLOSED and from SYN-RCVD to LISTEN"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.estab.resets.count"
    metadata:
      displayName: "TCP resets"
      description: "Number of transitions of TCP connections from
        ESTABLISHED/CLOSE-WAIT to CLOSED"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.curr.estab"
    metadata:
      displayName: "TCP connections"
      description: "Number of TCP connections in the ESTABLISHED/CLOSE-WAIT state"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.tcp.hc.total"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-cisco-device.tcp.hc.in.s\
        egs.count)+(com.dynatrace.extension.snmp-generic-cisco-device.tcp.hc.ou\
        t.segs.count)"
    metadata:
      displayName: "TCP segments sent + received"
      description: "Total number of segments sent + received"
      unit: "Count"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.hc.in.segs.count"
    metadata:
      displayName: "TCP segments received"
      description: "Total number of segments received (including errors)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.hc.out.segs.count"
    metadata:
      displayName: "TCP segments sent"
      description: "Total number of segments sent (excluding retransmissions)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.retrans.segs.count"
    metadata:
      displayName: "TCP segments retransmitted"
      description: "Total number of segments retransmitted"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.in.errs.count"
    metadata:
      displayName: "TCP segment errors"
      description: "Total number of segments received in error"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.tcp.out.rsts.count"
    metadata:
      displayName: "TCP segment resets"
      description: "Number of TCP segments sent containing the RST flag"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.udp.hc.total"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-cisco-device.udp.hc.in.d\
        atagrams.count)+(com.dynatrace.extension.snmp-generic-cisco-device.udp.\
        hc.out.datagrams.count)"
    metadata:
      displayName: "UDP datagrams sent + received"
      description: "Total number of UDP datagrams sent + received"
      unit: "Count"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.udp.hc.in.datagrams.cou\
      nt"
    metadata:
      displayName: "UDP datagrams delivered"
      description: "Total number of UDP datagrams delivered"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.udp.noports.count"
    metadata:
      displayName: "UDP datagrams received without port"
      description: "Number of received UDP datagrams (no application at the
        destination port)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.udp.in.errors.count"
    metadata:
      displayName: "UDP datagram errors"
      description: "Number of received and not delivered UDP datagrams (other than no
        application at the destination port)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.udp.hc.out.datagrams.co\
      unt"
    metadata:
      displayName: "UDP datagrams sent"
      description: "Total number of UDP datagrams sent"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.totaltraffic"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-cisco-device.udp.hc.in.d\
        atagrams.count)+(com.dynatrace.extension.snmp-generic-cisco-device.udp.\
        hc.out.datagrams.count)+(com.dynatrace.extension.snmp-generic-cisco-dev\
        ice.tcp.hc.in.segs.count)+(com.dynatrace.extension.snmp-generic-cisco-d\
        evice.tcp.hc.out.segs.count)"
    metadata:
      displayName: "Overall TCP & UDP elements"
      description: "Total number of TCP segments and UDP datagrams sent and received"
      unit: "Count"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.if.highspeed"
    metadata:
      displayName: "Interface speed"
      description: "Speed of the network interface in MegaBits per second."
      unit: "MegaBitPerSecond"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_network_interface"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.in.octets.bitpe\
      rsec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-cisco-device.if.in.octe\
        ts.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface incoming traffic"
      description: "Incoming network traffic on interface in bits per second."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.hc.in.octets.bi\
      tpersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-cisco-device.if.hc.in.o\
        ctets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface incoming traffic (high capacity)"
      description: "Incoming network traffic on interface in bits per second. This
        metric uses high capacity octet metrics and should be used for highspeed
        devices."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.out.octets.bitp\
      ersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-cisco-device.if.out.oct\
        ets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface outgoing traffic"
      description: "Outgoing network traffic on interface in bits per second."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.hc.out.octets.b\
      itpersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-cisco-device.if.hc.out.\
        octets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface outgoing traffic (high capacity)"
      description: "Outgoing network traffic on interface in bits per second. This
        metric uses high capacity octet metrics and should be used for highspeed
        devices."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.bandwidth"
    query:
      metricSelector: "((((((com.dynatrace.extension.snmp-generic-cisco-device.if.hc.\
        in.octets.count) *
        (8)):rate(1s))+(((com.dynatrace.extension.snmp-generic-cisco-device.if.\
        hc.out.octets.count) *
        (8)):rate(1s)))/((com.dynatrace.extension.snmp-generic-cisco-device.if.\
        highspeed) * 1000000)) * (100))"
    metadata:
      displayName: "Interface bandwidth utilization"
      description: "Bandwidth utilization on interface. Computed as sum of incoming
        and outgoing traffic divided by interface speed. Presented as
        percentage."
      unit: "Percent"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.in.bandwidth"
    query:
      metricSelector: "(((((com.dynatrace.extension.snmp-generic-cisco-device.if.hc.i\
        n.octets.count) *
        (8)):rate(1s))/((com.dynatrace.extension.snmp-generic-cisco-device.if.h\
        ighspeed) * (1000000))) * (100))"
    metadata:
      displayName: "Inbound bandwidth utilization"
      description: "Inbound bandwidth utilization on interface. Computed as sum of
        incoming traffic divided by interface speed. Presented as percentage."
      unit: "Percent"
  - key: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.out.bandwidth"
    query:
      metricSelector: "(((((com.dynatrace.extension.snmp-generic-cisco-device.if.hc.o\
        ut.octets.count) *
        (8)):rate(1s))/((com.dynatrace.extension.snmp-generic-cisco-device.if.h\
        ighspeed) * (1000000))) * (100))"
    metadata:
      displayName: "Outbound bandwidth utilization"
      description: "Outbound bandwidth utilization on interface. Computed as sum of
        outgoing traffic divided by interface speed. Presented as percentage."
      unit: "Percent"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.power_supply.state"
    metadata:
      displayName: "Power supply state"
      description: "A state metric representing the details of power supplies on the
        device. Value is always 1; use the dimensions to understand the status."
      unit: "NotApplicable"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.component.state"
    metadata:
      displayName: "Physical component state"
      description: "A state metric representing the details of physical components.
        This is used to collect details about the Cisco device stack. Value is
        always 1; use the dimensions to view details."
      unit: "NotApplicable"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.memory_pool.used"
    metadata:
      displayName: "Memory pool used (32 bit)"
      description: "The number of bytes from the memory pool that are currently in use."
      unit: "Byte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.memory_pool.free"
    metadata:
      displayName: "Memory pool free (32 bit)"
      description: "The number of bytes from the memory pool that are currently unused."
      unit: "Byte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.enhanced.memory_pool.us\
      ed"
    metadata:
      displayName: "Memory pool used (64 bit)"
      description: "The number of bytes from the enhanced memory pool that are
        currently in use."
      unit: "Byte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.enhanced.memory_pool.fr\
      ee"
    metadata:
      displayName: "Memory pool free (64 bit)"
      description: "The number of bytes from the enhanced memory pool that are
        currently unused."
      unit: "Byte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.ha.active_supervisor.cp\
      u_utilization"
    metadata:
      displayName: "Active supervisor CPU utilization"
      description: "The average utilization of CPU on the active supervisor."
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.ha.active_supervisor.me\
      mory_utilization"
    metadata:
      displayName: "Active supervisor memory utilization"
      description: "The average utilization of memory on the active supervisor."
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.ha.synchronization.enab\
      led"
    metadata:
      displayName: "Synchronization state"
      description: "The state of the auto synchronization of images between the active
        and standby supervisor."
      unit: "State"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_cisco_device"
  - key: "com.dynatrace.extension.snmp-generic-cisco-device.ha.synchronization.stat\
      e"
    metadata:
      displayName: "Auto synchronization status"
      description: "The status of the current auto synchronization process, or if no
        such process is in progress, then the state of the most recent one."
      unit: "State"
