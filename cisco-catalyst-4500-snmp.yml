              condition: "$eq(com.dynatrace.extension.snmp-generic-cisco-device.sys.uptime)"
          attributes:
            - key: "dt.ip_addresses"
              pattern: "{device.address}"
              displayName: "IP Address"
            - key: "dt.listen_ports"
              pattern: "{device.port}"
              displayName: "Listen Port"
            - key: "dt.dns_names"
              pattern: "{device.name}"
              displayName: "DNS Names"
            - key: "devType"
              pattern: "{device.type}"
              displayName: "Device Type"
            - key: "devMonitoringMode"
              pattern: "{monitoring.mode}"
              displayName: "Monitoring Mode"
            - key: "lldpChassisId"
              pattern: "{lldp.chassis.id}"
              displayName: "LLDP Chassis ID"
            - key: "devSysContact"
              pattern: "{sys.contact}"
              displayName: "Contact"
            - key: "dt.security_context"
              pattern: "{dt.security_context}"
              displayName: "Security Context"
          requiredDimensions:
            - key: "device.name"
            - key: "device.address"
            - key: "device.type"
            - key: "lldp.chassis.id"
          instanceNamePattern: "{sys.name}"
