    entitiesListCards:
      - key: "network_interfaces"
        displayName: "Network Interfaces"
        entitySelectorTemplate: "type(snmp:com_dynatrace_extension_snmp_generic_cisco_n\
          etwork_interface), fromRelationships.isChildOf($(entityConditions))"
        pageSize: 10
        displayCharts: true
        enableDetailsExpandability: true
        hideEmptyCharts: true
        numberOfVisibleCharts: 2
        charts:
          - displayName: "Traffic 64-bit"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.hc.i\
                    n.octets.bitpersec"
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.hc.o\
                    ut.octets.bitpersec"
          - displayName: "Bandwidth"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.in.b\
                    andwidth"
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.out.\
                    bandwidth"
          - displayName: "Traffic 32-bit"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.in.o\
                    ctets.bitpersec"
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-cisco-device.if.out.\
                    octets.bitpersec"
          - displayName: "CRC errors"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ci\
                sco-device.if.in.crc_errors.count:filter(in(\"dt.entity.snmp:co\
                m_dynatrace_extension_snmp_generic_cisco_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-cisco-device.if.in.crc_er\
                    rors.count"
        displayIcons: true
        columns:
          - type: "ATTRIBUTE"
            attribute:
              key: "highspeed"
              displayName: "IF speed (Mbps)"
          - type: "ATTRIBUTE"
            attribute:
              key: "type"
              displayName: "IF type"
          - type: "ATTRIBUTE"
            attribute:
              key: "opStatus"
              displayName: "Operational status"
        filtering:
          relationships:
            - "type(snmp:com_dynatrace_extension_snmp_generic_cisco_device),
              toRelationships.isChildOf($(entityConditions))"
          entityFilters:
            - displayName: "Filters"
              filters:
                - type: "entityName"
                  entityTypes:
                    - "snmp:com_dynatrace_extension_snmp_generic_cisco_network_\
                      interface"
                  displayName: "Name"
                  freeText: true
                  modifier: "contains"
                  defaultSearch: true
                  distinct: true
                - type: "opStatus"
                  entityTypes:
                    - "snmp:com_dynatrace_extension_snmp_generic_cisco_network_\
                      interface"
                  displayName: "Operational status"
                  freeText: true
                  modifier: "contains"
                  defaultSearch: false
                  distinct: true
      - key: "network_peers"
        displayName: "Network Peers"
        entitySelectorTemplate: "type(snmp:cisco_peer),toRelationships.calls($(entityConditions))"
        pageSize: 10
        displayCharts: false
        enableDetailsExpandability: false
        numberOfVisibleCharts: 0
        displayIcons: false
        columns:
          - type: "ATTRIBUTE"
            attribute:
              key: "remote_address"
              displayName: "Remote IP Address"
          - type: "ATTRIBUTE"
            attribute:
              key: "protocol"
              displayName: "Discovery Protocol"
        filtering:
          relationships:
            - "type(snmp:com_dynatrace_extension_snmp_generic_cisco_device),
              toRelationships.isChildOf($(entityConditions))"
    dqlTableCards:
