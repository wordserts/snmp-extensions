name: "custom:arista-bgp"
minDynatraceVersion: "1.318.0"
minEECVersion: "1.251"
author:
  name: "Custom Extensions Creator App"
version: "0.0.8"
vars:
  - id: "ext.activationtag"
    displayName: "Extension activation tag"
    type: "text"
  - id: "if_name"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Name"
    maxLength: 50000
  - id: "if_admin_status"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Admin Status"
    maxLength: 50000
  - id: "if_oper_status"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Operational Status"
    maxLength: 50000
  - id: "if_alias"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Alias"
    maxLength: 50000
  - id: "if_type"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Type"
    maxLength: 50000
metrics:
  - key: "com.dynatrace.extension.snmp-generic-arista-device.entity_attributes"
    metadata:
      displayName: "Device entity attributes"
      description: "Constant value of 1 used for reporting entity attributes at a
        lower frequency"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.cpu.total.1min"
    metadata:
      displayName: "CPU utilization"
      description: "Overall CPU utilization percentage in the last 1 min."
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.cpu.total.5min"
    metadata:
      displayName: "CPU utilization"
      description: "Overall CPU utilization percentage in the last 5 min."
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.memory.used"
    metadata:
      displayName: "Memory used"
      description: "Total memory currently in use"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.memory.free"
    metadata:
      displayName: "Memory free"
      description: "Total memory available"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.memory.total"
    metadata:
      displayName: "Memory total"
      description: "Total memory installed"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.temperature.sensor.val\
      ue"
    metadata:
      displayName: "Temperature sensor value"
      description: "Current temperature reading from sensors"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.fan.status"
    metadata:
      displayName: "Fan status"
      description: "Current status of fan components"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.power.supply.status"
    metadata:
      displayName: "Power supply status"
      description: "Current status of power supply units"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.pkts.count"
    metadata:
      displayName: "Messages delivered"
      description: "Total number of messages delivered from the transport service"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.out.pkts.count"
    metadata:
      displayName: "Messages passed"
      description: "Total number of messages passed to the transport service"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.silentdrops.count"
    metadata:
      displayName: "Silently dropped PDUs"
      description: "Number of silently dropped PDUs due to the large reply size"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.drops.proxy.count"
    metadata:
      displayName: "Proxy dropped PDUs"
      description: "Number of silently dropped PDUs due to reason other than a time-out"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.bad.versions.c\
      ount"
    metadata:
      displayName: "Unsupported SNMP version messages"
      description: "Total number of messages delivered with an unsupported SNMP version"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.bad.community.\
      names.count"
    metadata:
      displayName: "Messages with bad community names"
      description: "Number of messages with an unknown SNMP community"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.bad.community.\
      uses.count"
    metadata:
      displayName: "Messages not allowed in community"
      description: "Number of messages not allowed for the used SNMP community"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.nosuchnames.co\
      unt"
    metadata:
      displayName: "'noSuchName' errors"
      description: "Number of PDUs delivered with 'noSuchName' error"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.bad.values.cou\
      nt"
    metadata:
      displayName: "'badValue' errors"
      description: "Number of PDUs delivered with 'badValue' error"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.traps.count"
    metadata:
      displayName: "Traps processed"
      description: "Total number of SNMP Trap PDUs accepted and processed"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.snmp.out.traps.count"
    metadata:
      displayName: "Traps generated"
      description: "Total number of SNMP Trap PDUs generated"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.sys.uptime"
    metadata:
      displayName: "Time since the last re-start"
      description: "The time (in hundredths of a second) since the network management
        portion of the system was last re-initialized"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.sys.uptime.millis"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-arista-device.sys.uptime) * (10)"
    metadata:
      displayName: "Time since the last re-start"
      description: "The time (in milliseconds) since the network management portion of
        the system was last re-initialized"
      unit: "MilliSecond"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.lastchange"
    metadata:
      displayName: "Last interface status change"
      description: "Value of 'sysUpTime' when the interface entered its current state"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.in.octets.count"
    metadata:
      displayName: "Octets received"
      description: "The total number of octets received on the interface including
        framing characters"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.hc.in.octets.count"
    metadata:
      displayName: "Octets received (high capacity)"
      description: "The total number of octets received on the interface including
        framing characters. This metric uses 64 bit counter and should be used
        for highspeed devices."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.in.errors.count"
    metadata:
      displayName: "Inbound errors"
      description: "Number of inbound packets/transmission units with errors"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.in.discards.count"
    metadata:
      displayName: "Inbound discards"
      description: "Number of inbound packets discarded"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.out.octets.count"
    metadata:
      displayName: "Octets transmitted"
      description: "The total number of octets transmitted out of the interface
        including framing characters"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.hc.out.octets.count"
    metadata:
      displayName: "Octets transmitted (high capacity)"
      description: "The total number of octets transmitted out of the interface
        including framing characters. This metric uses 64 bit counter and should
        be used for highspeed devices."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.out.errors.count"
    metadata:
      displayName: "Outbound errors"
      description: "Number of outbound packets/transmission units with errors"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.out.discards.count"
    metadata:
      displayName: "Outbound discards"
      description: "Number of outbound packets discarded"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.activeopens.count"
    metadata:
      displayName: "TCP active opens"
      description: "Number of transitions of TCP connections from CLOSED to SYN-SENT"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.passiveopens.count"
    metadata:
      displayName: "TCP passive opens"
      description: "Number of transitions of TCP connections from CLOSED to SYN-RCVD"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.attemptfails.count"
    metadata:
      displayName: "TCP failed attempts"
      description: "Number of transitions of TCP connections from SYN-SENT/SYN-RCVD to
        CLOSED and from SYN-RCVD to LISTEN"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.estab.resets.count"
    metadata:
      displayName: "TCP resets"
      description: "Number of transitions of TCP connections from
        ESTABLISHED/CLOSE-WAIT to CLOSED"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.curr.estab"
    metadata:
      displayName: "TCP connections"
      description: "Number of TCP connections in the ESTABLISHED/CLOSE-WAIT state"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.tcp.hc.total"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-arista-device.tcp.hc.in.\
        segs.count)+(com.dynatrace.extension.snmp-generic-arista-device.tcp.hc.\
        out.segs.count)"
    metadata:
      displayName: "TCP segments sent + received"
      description: "Total number of segments sent + received"
      unit: "Count"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.hc.in.segs.count"
    metadata:
      displayName: "TCP segments received"
      description: "Total number of segments received (including errors)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.hc.out.segs.count"
    metadata:
      displayName: "TCP segments sent"
      description: "Total number of segments sent (excluding retransmissions)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.retrans.segs.count"
    metadata:
      displayName: "TCP segments retransmitted"
      description: "Total number of segments retransmitted"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.in.errs.count"
    metadata:
      displayName: "TCP segment errors"
      description: "Total number of segments received in error"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.tcp.out.rsts.count"
    metadata:
      displayName: "TCP segment resets"
      description: "Number of TCP segments sent containing the RST flag"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.udp.hc.total"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-arista-device.udp.hc.in.\
        datagrams.count)+(com.dynatrace.extension.snmp-generic-arista-device.ud\
        p.hc.out.datagrams.count)"
    metadata:
      displayName: "UDP datagrams sent + received"
      description: "Total number of UDP datagrams sent + received"
      unit: "Count"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.udp.hc.in.datagrams.co\
      unt"
    metadata:
      displayName: "UDP datagrams delivered"
      description: "Total number of UDP datagrams delivered"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.udp.noports.count"
    metadata:
      displayName: "UDP datagrams received without port"
      description: "Number of received UDP datagrams (no application at the
        destination port)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.udp.in.errors.count"
    metadata:
      displayName: "UDP datagram errors"
      description: "Number of received and not delivered UDP datagrams (other than no
        application at the destination port)"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.udp.hc.out.datagrams.c\
      ount"
    metadata:
      displayName: "UDP datagrams sent"
      description: "Total number of UDP datagrams sent"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.totaltraffic"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-arista-device.udp.hc.in.\
        datagrams.count)+(com.dynatrace.extension.snmp-generic-arista-device.ud\
        p.hc.out.datagrams.count)+(com.dynatrace.extension.snmp-generic-arista-\
        device.tcp.hc.in.segs.count)+(com.dynatrace.extension.snmp-generic-aris\
        ta-device.tcp.hc.out.segs.count)"
    metadata:
      displayName: "Overall TCP & UDP elements"
      description: "Total number of TCP segments and UDP datagrams sent and received"
      unit: "Count"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.if.highspeed"
    metadata:
      displayName: "Interface speed"
      description: "Speed of the network interface in MegaBits per second."
      unit: "MegaBitPerSecond"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_network_interface"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.if.in.octets.bitp\
      ersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-arista-device.if.in.oct\
        ets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface incoming traffic"
      description: "Incoming network traffic on interface in bits per second."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.if.hc.in.octets.b\
      itpersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-arista-device.if.hc.in.\
        octets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface incoming traffic (high capacity)"
      description: "Incoming network traffic on interface in bits per second. This
        metric uses high capacity octet metrics and should be used for highspeed
        devices."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.if.out.octets.bit\
      persec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-arista-device.if.out.oc\
        tets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface outgoing traffic"
      description: "Outgoing network traffic on interface in bits per second."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.if.hc.out.octets.\
      bitpersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-arista-device.if.hc.out\
        .octets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface outgoing traffic (high capacity)"
      description: "Outgoing network traffic on interface in bits per second. This
        metric uses high capacity octet metrics and should be used for highspeed
        devices."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.if.bandwidth"
    query:
      metricSelector: "((((((com.dynatrace.extension.snmp-generic-arista-device.if.hc\
        .in.octets.count) *
        (8)):rate(1s))+(((com.dynatrace.extension.snmp-generic-arista-device.if\
        .hc.out.octets.count) *
        (8)):rate(1s)))/((com.dynatrace.extension.snmp-generic-arista-device.if\
        .highspeed) * 1000000)) * (100))"
    metadata:
      displayName: "Interface bandwidth utilization"
      description: "Bandwidth utilization on interface. Computed as sum of incoming
        and outgoing traffic divided by interface speed. Presented as
        percentage."
      unit: "Percent"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.if.in.bandwidth"
    query:
      metricSelector: "(((((com.dynatrace.extension.snmp-generic-arista-device.if.hc.\
        in.octets.count) *
        (8)):rate(1s))/((com.dynatrace.extension.snmp-generic-arista-device.if.\
        highspeed) * (1000000))) * (100))"
    metadata:
      displayName: "Inbound bandwidth utilization"
      description: "Inbound bandwidth utilization on interface. Computed as sum of
        incoming traffic divided by interface speed. Presented as percentage."
      unit: "Percent"
  - key: "func:com.dynatrace.extension.snmp-generic-arista-device.if.out.bandwidth"
    query:
      metricSelector: "(((((com.dynatrace.extension.snmp-generic-arista-device.if.hc.\
        out.octets.count) *
        (8)):rate(1s))/((com.dynatrace.extension.snmp-generic-arista-device.if.\
        highspeed) * (1000000))) * (100))"
    metadata:
      displayName: "Outbound bandwidth utilization"
      description: "Outbound bandwidth utilization on interface. Computed as sum of
        outgoing traffic divided by interface speed. Presented as percentage."
      unit: "Percent"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.peer.state"
    metadata:
      displayName: "BGP peer connection state"
      description: "The BGP peer connection state. idle(1), connect(2), active(3),
        opensent(4), openconfirm(5), established(6). BGP4-MIB."
      unit: "State"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.peer.admin.status"
    metadata:
      displayName: "BGP peer admin status"
      description: "The desired state of the BGP connection. stop(1), start(2). BGP4-MIB."
      unit: "State"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.established_time"
    metadata:
      displayName: "BGP peer established time"
      description: "This timer indicates how long (in seconds) this peer has been in
        the established state or how long since this peer was last in the
        established state."
      unit: "Second"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.peer.in.updates.c\
      ount"
    metadata:
      displayName: "BGP peer inbound updates"
      description: "The number of BGP UPDATE messages received on this connection.
        BGP4-MIB."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.peer.out.updates.\
      count"
    metadata:
      displayName: "BGP peer outbound updates"
      description: "The number of BGP UPDATE messages transmitted on this connection.
        BGP4-MIB."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.peer.in.totalmess\
      ages.count"
    metadata:
      displayName: "BGP peer total inbound messages"
      description: "The total number of messages received from the remote peer on this
        connection. BGP4-MIB."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.peer.out.totalmes\
      sages.count"
    metadata:
      displayName: "BGP peer total outbound messages"
      description: "The total number of messages transmitted to the remote peer on
        this connection. BGP4-MIB."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
  - key: "com.dynatrace.extension.snmp-generic-arista-device.bgp4.peer.fsm.establis\
      hed.transitions.count"
    metadata:
      displayName: "BGP peer FSM established transitions"
      description: "The total number of times the BGP FSM transitioned into the
        established state. BGP4-MIB."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_arista_device"
snmp:
  - group: "generic-arista-device-attributes"
    interval:
