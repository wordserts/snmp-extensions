                  dqlQuery: "timeseries
                    versions=sum(`com.dynatrace.extension.snmp-generic-arista-d\
                    evice.snmp.in.bad.versions.count`),by:{`dt.entity.snmp:com_\
                    dynatrace_extension_snmp_generic_arista_device`},filter:{`d\
                    t.entity.snmp:com_dynatrace_extension_snmp_generic_arista_d\
                    evice`==$(entityId)}"
              visualization:
                themeColor: "PURPLE"
                seriesType: "AREA"
          - displayName: "SNMP Messages"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.pkt\
                    s.count:splitBy(\"dt.entity.snmp:com_dynatrace_extension_sn\
                    mp_generic_arista_device\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.snmp.in.pkts.count`),by:{`dt.entity.snmp:com_dynatrace_e\
                    xtension_snmp_generic_arista_device`},filter:{`dt.entity.sn\
                    mp:com_dynatrace_extension_snmp_generic_arista_device`==$(e\
                    ntityId)}"
          - displayName: "PDU Problems"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              visualization:
                themeColor: "RED"
                seriesType: "COLUMN"
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.bad\
                    .values.count:splitBy(\"dt.entity.snmp:com_dynatrace_extens\
                    ion_snmp_generic_arista_device\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.snmp.in.bad.values.count`),by:{`dt.entity.snmp:com_dynat\
                    race_extension_snmp_generic_arista_device`},filter:{`dt.ent\
                    ity.snmp:com_dynatrace_extension_snmp_generic_arista_device\
                    `==$(entityId)}"
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.nos\
                    uchnames.count:splitBy(\"dt.entity.snmp:com_dynatrace_exten\
                    sion_snmp_generic_arista_device\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.snmp.in.nosuchnames.count`),by:{`dt.entity.snmp:com_dyna\
                    trace_extension_snmp_generic_arista_device`},filter:{`dt.en\
                    tity.snmp:com_dynatrace_extension_snmp_generic_arista_devic\
                    e`==$(entityId)}"
          - displayName: "Community Problems"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              visualization:
                themeColor: "DEFAULT"
                seriesType: "AREA"
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.bad\
                    .community.uses.count:splitBy(\"dt.entity.snmp:com_dynatrac\
                    e_extension_snmp_generic_arista_device\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.snmp.in.bad.community.uses.count`),by:{`dt.entity.snmp:c\
                    om_dynatrace_extension_snmp_generic_arista_device`},filter:\
                    {`dt.entity.snmp:com_dynatrace_extension_snmp_generic_arist\
                    a_device`==$(entityId)}"
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.snmp.in.bad\
                    .community.names.count:splitBy(\"dt.entity.snmp:com_dynatra\
                    ce_extension_snmp_generic_arista_device\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.snmp.in.bad.community.names.count`),by:{`dt.entity.snmp:\
                    com_dynatrace_extension_snmp_generic_arista_device`},filter\
                    :{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_aris\
                    ta_device`==$(entityId)}"
      - key: "network_stats"
        target: "BOTH"
        mode: "NORMAL"
        displayName: "Network Statistics"
        description: "Populated from IF-MIB and TCP/UDP-MIB"
        hideEmptyCharts: true
        numberOfVisibleCharts: 4
        chartsInRow: 2
        charts:
          - displayName: "Network Interfaces Traffic"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ar\
                ista-device.if.hc.out.octets.count:filter(in(\"dt.entity.snmp:c\
                om_dynatrace_extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-arista-device.if.hc.\
                    out.octets.bitpersec:splitBy()"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.if.hc.out.octets.count`),

                    \ 
                    by:{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_ar\
                    ista_device`},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_arista_device`==$(entityId)}

                    \  | fieldsAdd expression=count[]*8/toDouble(interval/1s)

                    \  | fieldsRemove count

                    \  | summarize
                    expression=sum(expression[]),interval=takeAny(interval),tim\
                    eframe=takeAny(timeframe),

                    \    by:{}\n"
                  visualization:
                    displayName: "Interface outgoing traffic (high capacity)"
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-arista-device.if.hc.\
                    in.octets.bitpersec:splitBy()"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.if.hc.in.octets.count`),

                    \ 
                    by:{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_ar\
                    ista_device`},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_arista_device`==$(entityId)}

                    \  | fieldsAdd expression=count[]*8/toDouble(interval/1s)

                    \  | fieldsRemove count

                    \  | summarize
                    expression=sum(expression[]),interval=takeAny(interval),tim\
                    eframe=takeAny(timeframe),

                    \    by:{}\n"
                  visualization:
                    displayName: "Interface incoming traffic (high capacity)"
          - displayName: "Interfaces Bandwidth Utilization"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ar\
                ista-device.if.hc.in.octets.count:filter(in(\"dt.entity.snmp:co\
                m_dynatrace_extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-arista-device.if.ban\
                    dwidth:splitBy()"
                  dqlQuery: "timeseries
                    in.octets.count=sum(`com.dynatrace.extension.snmp-generic-a\
                    rista-device.if.hc.in.octets.count`),out.octets.count=sum(`\
                    com.dynatrace.extension.snmp-generic-arista-device.if.hc.ou\
                    t.octets.count`),highspeed=avg(`com.dynatrace.extension.snm\
                    p-generic-arista-device.if.highspeed`),

                    \ 
                    by:{if.operstatus,sys.contact,device.address,`dt.entity.snm\
                    p:com_dynatrace_extension_snmp_generic_arista_network_inter\
                    face`,dt.metrics.source,if.speed,device.port,if.idx,if.high\
                    speed,if.type,`dt.entity.snmp:com_dynatrace_extension_snmp_\
                    generic_arista_device`,if.descr,device.name,if.adminstatus,\
                    device,if.mtu,if.promiscuousmode,sys.name},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_arista_device`==$(entityId)}

                    \  | fieldsAdd
                    expression=(((in.octets.count[]*8)+(out.octets.count[]*8))/\
                    (highspeed[]*1000000))*100/toDouble(interval/1s)

                    \  | fieldsRemove in.octets.count,out.octets.count,highspeed

                    \  | summarize
                    expression=sum(expression[]),interval=takeAny(interval),tim\
                    eframe=takeAny(timeframe),

                    \    by:{}\n"
                  visualization:
                    displayName: "Interface bandwidth utilization"
          - displayName: "Overall TCP & UDP Traffic"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ar\
                ista-device.udp.hc.in.datagrams.count:filter(in(\"dt.entity.snm\
                p:com_dynatrace_extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-arista-device.totalt\
                    raffic:splitBy()"
                  dqlQuery: "timeseries
                    in.datagrams.count=sum(`com.dynatrace.extension.snmp-generi\
                    c-arista-device.udp.hc.in.datagrams.count`),out.datagrams.c\
                    ount=sum(`com.dynatrace.extension.snmp-generic-arista-devic\
                    e.udp.hc.out.datagrams.count`),in.segs.count=sum(`com.dynat\
                    race.extension.snmp-generic-arista-device.tcp.hc.in.segs.co\
                    unt`),out.segs.count=sum(`com.dynatrace.extension.snmp-gene\
                    ric-arista-device.tcp.hc.out.segs.count`),

                    \ 
                    by:{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_ar\
                    ista_device`,sys.contact,device.address,device.name,dt.metr\
                    ics.source,device.port,device,sys.name},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_arista_device`==$(entityId)}

                    \  | fieldsAdd
                    expression=in.datagrams.count[]+out.datagrams.count[]+in.se\
                    gs.count[]+out.segs.count[]

                    \  | fieldsRemove
                    in.datagrams.count,out.datagrams.count,in.segs.count,out.se\
                    gs.count\n"
                  visualization:
                    displayName: "Overall TCP and UDP traffic"
          - displayName: "TCP traffic"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ar\
                ista-device.tcp.hc.in.segs.count:filter(in(\"dt.entity.snmp:com\
                _dynatrace_extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.tcp.hc.in.s\
                    egs.count:splitBy(\"dt.entity.snmp:com_dynatrace_extension_\
                    snmp_generic_arista_device\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.tcp.hc.in.segs.count`),

                    \ 
                    by:{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_ar\
                    ista_device`,sys.contact,device.address,device.name,dt.metr\
                    ics.source,device.port,device,sys.name},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_arista_device`==$(entityId)}\n"
                  visualization:
                    displayName: "TCP segments received"
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.tcp.hc.out.\
                    segs.count:splitBy(\"dt.entity.snmp:com_dynatrace_extension\
                    _snmp_generic_arista_device\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.tcp.hc.out.segs.count`),
                    by:{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_ar\
                    ista_device`,sys.contact,device.address,device.name,dt.metr\
                    ics.source,device.port,device,sys.name},
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_arista_device`==$(entityId)}\n"
                  visualization:
                    displayName: "TCP segments sent"
      - key: "device_stats"
        target: "BOTH"
        mode: "NORMAL"
        displayName: "Device Statistics"
        description: "Populated from HOST-RESOURCES-MIB"
        hideEmptyCharts: true
        numberOfVisibleCharts: 2
        charts:
          - displayName: "CPU utilization"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.cpu.total.1\
                    min:splitBy(\"dt.entity.snmp:com_dynatrace_extension_snmp_g\
                    eneric_arista_device\")"
                  dqlQuery: "timeseries
                    cpu=avg(`com.dynatrace.extension.snmp-generic-arista-device\
                    .cpu.total.1min`),by:{`dt.entity.snmp:com_dynatrace_extensi\
                    on_snmp_generic_arista_device`},filter:{`dt.entity.snmp:com\
                    _dynatrace_extension_snmp_generic_arista_device`==$(entityI\
                    d)}"
          - displayName: "Memory usage"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.memory.used\
                    :splitBy(\"dt.entity.snmp:com_dynatrace_extension_snmp_gene\
                    ric_arista_device\")"
                  dqlQuery: "timeseries
                    used=avg(`com.dynatrace.extension.snmp-generic-arista-devic\
                    e.memory.used`),by:{`dt.entity.snmp:com_dynatrace_extension\
                    _snmp_generic_arista_device`},filter:{`dt.entity.snmp:com_d\
                    ynatrace_extension_snmp_generic_arista_device`==$(entityId)\
                    }"
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.memory.tota\
                    l:splitBy(\"dt.entity.snmp:com_dynatrace_extension_snmp_gen\
                    eric_arista_device\")"
                  dqlQuery: "timeseries
                    total=avg(`com.dynatrace.extension.snmp-generic-arista-devi\
                    ce.memory.total`),by:{`dt.entity.snmp:com_dynatrace_extensi\
                    on_snmp_generic_arista_device`},filter:{`dt.entity.snmp:com\
                    _dynatrace_extension_snmp_generic_arista_device`==$(entityI\
                    d)}"
      - key: "device_health"
        target: "BOTH"
        mode: "NORMAL"
        displayName: "Device Health"
        description: "Populated from Arista Enterprise MIBs"
        numberOfVisibleCharts: 3
        hideEmptyCharts: true
        charts:
          - displayName: "Temperature sensors"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.temperature\
                    .sensor.value:splitBy(entPhysicalDescr)"
                  dqlQuery: "timeseries
                    val=avg(`com.dynatrace.extension.snmp-generic-arista-device\
                    .temperature.sensor.value`),by:{entPhysicalDescr}"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ar\
                ista-device.temperature.sensor.value:filter(in(\"dt.entity.snmp\
                :com_dynatrace_extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
          - displayName: "Fan status"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.fan.status:\
                    splitBy(\"entPhysicalDescr\")"
                  dqlQuery: "timeseries
                    status=avg(`com.dynatrace.extension.snmp-generic-arista-dev\
                    ice.fan.status`),by:{entPhysicalDescr}"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ar\
                ista-device.fan.status:filter(in(\"dt.entity.snmp:com_dynatrace\
                _extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
          - displayName: "Power supply status"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-generic-arista-device.power.suppl\
                    y.status:splitBy(\"entPhysicalDescr\")"
                  dqlQuery: "timeseries
                    status=avg(`com.dynatrace.extension.snmp-generic-arista-dev\
                    ice.power.supply.status`),by:{entPhysicalDescr}"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-ar\
                ista-device.power.supply.status:filter(in(\"dt.entity.snmp:com_\
                dynatrace_extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
