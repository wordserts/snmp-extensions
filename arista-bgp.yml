                ista-device.bgp4.peer.state:filter(in(\"dt.entity.snmp:com_dyna\
                trace_extension_snmp_generic_arista_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
          - type: "CHART_GROUP"
            key: "device_health"
            conditions:
              - "extensionConfigured|extensionId=com.dynatrace.extension.snmp-g\
                eneric-arista-device|featureSets=Sensors"
          - type: "CHART_GROUP"
            key: "network_stats"
          - type: "CHART_GROUP"
            key: "snmp_health"
          - type: "DQL_TABLE"
            key: "network_interfaces_dql"
          - type: "ENTITIES_LIST"
            key: "network_interfaces"
