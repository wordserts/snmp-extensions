        - idPattern: "snmp_generic_viptela_network_interface_{device.address}-{if.idx}"
          sources:
            - sourceType: "Metrics"
              condition: "$prefix(com.dynatrace.extension.snmp-generic-viptela-device.if)"
          attributes:
            - pattern: "{device.address}"
              key: "dt.ip_addresses"
              displayName: "Network device address"
            - pattern: "{if.alias}"
              key: "alias"
              displayName: "Alias"
            - pattern: "{if.promiscuousmode}"
              key: "promiscuousMode"
              displayName: "PromiscuousMode"
            - pattern: "{if.speed}"
              key: "speed"
              displayName: "Interface Speed"
            - pattern: "{if.highspeed}"
              key: "highspeed"
              displayName: "Interface Speed (Mbps)"
            - pattern: "{if.type}"
              key: "type"
              displayName: "Interface Type"
            - pattern: "{if.operstatus}"
              key: "opStatus"
              displayName: "Operational Status"
            - pattern: "{if.mtu}"
              key: "mtu"
              displayName: "MTU"
            - pattern: "{if.descr}"
              key: "description"
              displayName: "Description"
            - pattern: "{if.adminstatus}"
              key: "adminStatus"
              displayName: "Admin Status"
            - key: "dt.security_context"
              pattern: "{dt.security_context}"
              displayName: "Security Context"
          requiredDimensions: []
          instanceNamePattern: "Viptela network interface {if.descr} @ {device.name}"
  relationships:
    - fromType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
      typeOfRelation: "SAME_AS"
      toType: "network:device"
      sources:
        - sourceType: "Metrics"
          condition: "$prefix(com.dynatrace.extension.snmp-generic-viptela-device)"
    - fromType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
      typeOfRelation: "SAME_AS"
      toType: "network:interface"
      sources:
        - sourceType: "Metrics"
          condition: "$prefix(com.dynatrace.extension.snmp-generic-viptela-device.if)"
    - typeOfRelation: "CHILD_OF"
      fromType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
      toType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
      enabled: true
      sources:
        - sourceType: "Metrics"
          condition: "$prefix(com.dynatrace.extension.snmp-generic-viptela-device)"
    - typeOfRelation: "SAME_AS"
      fromType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
      toType: "snmptraps:com_dynatrace_ext_snmp-traps"
      enabled: true
      sources:
        - sourceType: "Entities"
          mappingRules:
            - sourceProperty: "dt.ip_addresses"
              sourceTransformation: "Leave text as-is"
              destinationProperty: "dt.ip_addresses"
              destinationTransformation: "Leave text as-is"
screens:
  - entityType: "network:device"
    propertiesCard:
      displayOnlyConfigured: false
      properties:
        - type: "RELATION"
          importantProperty: true
          relation:
            entitySelectorTemplate: "type(\"snmp:com_dynatrace_extension_snmp_generic_vipte\
              la_device\"),fromRelationships.isSameAs($(entityConditions))"
            displayName: "Viptela Device"
    detailsInjections:
      - key: "viptela_cpu_memory"
        type: "CHART_GROUP"
        entitySelectorTemplate: "type(\"snmp:com_dynatrace_extension_snmp_generic_vipte\
          la_device\"),fromRelationships.isSameAs($(entityConditions))"
        conditions:
          - "relatedEntity|entitySelectorTemplate=type(\"snmp:com_dynatrace_ext\
            ension_snmp_generic_viptela_device\"),fromRelationships.isSameAs($(\
            entityConditions))"
          - "entityAttribute|devMonitoringMode=Extension"
      - key: "device_stats"
        type: "CHART_GROUP"
        entitySelectorTemplate: "type(\"snmp:com_dynatrace_extension_snmp_generic_vipte\
          la_device\"),fromRelationships.isSameAs($(entityConditions))"
        conditions:
          - "relatedEntity|entitySelectorTemplate=type(\"snmp:com_dynatrace_ext\
            ension_snmp_generic_viptela_device\"),fromRelationships.isSameAs($(\
            entityConditions))"
          - "entityAttribute|devMonitoringMode=Extension"
      - key: "network_stats"
        type: "CHART_GROUP"
        entitySelectorTemplate: "type(\"snmp:com_dynatrace_extension_snmp_generic_vipte\
          la_device\"),fromRelationships.isSameAs($(entityConditions))"
        conditions:
          - "relatedEntity|entitySelectorTemplate=type(\"snmp:com_dynatrace_ext\
            ension_snmp_generic_viptela_device\"),fromRelationships.isSameAs($(\
            entityConditions))"
          - "entityAttribute|devMonitoringMode=Extension"
  - entityType: "snmptraps:com_dynatrace_ext_snmp-traps"
    detailsInjections:
      - type: "MESSAGE"
        key: "related-viptela-entity"
        width: "FULL_SIZE"
        conditions:
          - "relatedEntity|entitySelectorTemplate=type(snmp:com_dynatrace_exten\
            sion_snmp_generic_viptela_device),fromRelationships.isSameAs($(enti\
            tyConditions))"
    messageCards:
      - key: "related-viptela-entity"
        target: "CLASSIC"
        type: "MESSAGE"
        message:
          text: "Jump to related [Viptela
            device](relatedEntityScreen|entitySelectorTemplate=type(snmp:com_dy\
            natrace_extension_snmp_generic_viptela_device),fromRelationships.is\
            SameAs($(entityConditions))|name=Viptela device)"
          theme: "INFO"
  - entityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
    propertiesCard:
      displayOnlyConfigured: false
      properties:
        - type: "ATTRIBUTE"
          attribute:
            key: "system_name"
            displayName: "Name"
        - type: "ATTRIBUTE"
          attribute:
            key: "dt.dns_names"
            displayName: "DNS name"
            hidden: true
    detailsSettings:
      target: "BOTH"
      staticContent:
        breadcrumbs:
          - entityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
            type: "ENTITY_LIST_REF"
        showProblems: true
        showProperties: true
        showAddTag: true
        showTags: true
        showGlobalFilter: false
      layout:
        autoGenerate: false
        cards:
          - type: "CHART_GROUP"
            key: "device_stats"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-vi\
                ptela-device.memory.used:filter(in(\"dt.entity.snmp:com_dynatra\
                ce_extension_snmp_generic_viptela_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
          - type: "CHART_GROUP"
            key: "network_stats"
          - type: "DQL_TABLE"
            key: "network_interfaces_dql"
          - type: "ENTITIES_LIST"
            key: "network_interfaces"
          - conditions:
              - "!extensionConfigured|extensionId=com.dynatrace.extension.snmp-\
                traps-generic"
            type: "MESSAGE"
            key: "snmp_traps_info"
          - conditions:
              - "!extensionConfigured|extensionId=com.dynatrace.extension.snmp-\
                traps-generic"
            key: "snmp_traps_info_platform"
            type: "MESSAGE"
            width: "FULL_SIZE"
          - type: "CHART_GROUP"
            key: "traps_stats"
            conditions:
              - "extensionConfigured|extensionId=com.dynatrace.extension.snmp-t\
                raps-generic"
          - conditions:
              - "extensionConfigured|extensionId=com.dynatrace.extension.snmp-t\
                raps-generic"
            key: "traps_logs"
            type: "LOGS"
            width: "FULL_SIZE"
          - type: "INJECTIONS"
    messageCards:
      - key: "snmp_traps_info"
        target: "CLASSIC"
        type: "MESSAGE"
        message:
          text: "Set up [SNMP
            Traps](hubExtension|extensionId=com.dynatrace.extension.snmp-traps-\
            generic|text=SNMP Traps) extension to improve observability of this
            device"
          theme: "INFO"
      - key: "snmp_traps_info_platform"
        target: "PLATFORM"
        type: "MESSAGE"
        message:
          text: "Set up SNMP Traps extension (com.dynatrace.extension.snmp-traps-generic)
            to improve observability of this device"
          theme: "INFO"
    logsCards:
      - displayName: "Traps and logs"
        target: "BOTH"
        enablePaging: true
        filterQuery: "dt.source_entity inEntitySelector
          \"type(snmptraps:com_dynatrace_ext_snmp-traps),toRelationships.isSame\
          As($(entityConditions))\""
        key: "traps_logs"
        pageSize: 10
        showFiltering: true
        dqlQueryTable: "fetch logs| filter dt.source_entity in [ fetch
          `dt.entity.snmptraps:com_dynatrace_ext_snmp-traps` | filter
          in(same_as[`dt.entity.snmp:com_dynatrace_extension_snmp_generic_vipte\
          la_device`], $(entityId))| fields id ]"
    chartsCards:
      - key: "viptela_cpu_memory"
        target: "BOTH"
        mode: "NORMAL"
        displayName: "Viptela CPU & Memory Overview"
        description: "CPU and Memory metrics from Viptela devices"
        hideEmptyCharts: true
        numberOfVisibleCharts: 2
        charts:
          - displayName: "CPU Usage"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.network_device.cpu_usage:splitBy()"
                  dqlQuery: "timeseries
                    cpu=avg(`com.dynatrace.extension.network_device.cpu_usage`)"
                  visualization:
                    displayName: "CPU Usage"
                    seriesType: "AREA"
                    themeColor: "BLUE"
          - displayName: "Memory Usage"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.network_device.memory_used:splitBy()"
                  dqlQuery: "timeseries
                    used=avg(`com.dynatrace.extension.network_device.memory_use\
                    d`)"
                  visualization:
                    displayName: "Memory Used"
                    seriesType: "AREA"
                    themeColor: "GREEN"
                - metricSelector: "com.dynatrace.extension.network_device.memory_total:splitBy()"
                  dqlQuery: "timeseries
                    total=avg(`com.dynatrace.extension.network_device.memory_to\
                    tal`)"
                  visualization:
                    displayName: "Memory Total"
                    seriesType: "LINE"
                    themeColor: "GRAY"
      - key: "traps_stats"
        target: "BOTH"
        mode: "NORMAL"
        entitySelectorTemplate: "type(snmptraps:com_dynatrace_ext_snmp-traps),toRelatio\
          nships.isSameAs($(entityConditions))"
        charts:
          - conditions: []
            displayName: "Traps Count"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-traps-generic.traps.count:splitBy\
                    ()"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-traps-generic.traps\
                    .count`)"
                  visualization:
                    displayName: "Traps count"
                    seriesType: "COLUMN"
              yAxes: []
            visualizationType: "GRAPH_CHART"
          - conditions: []
            displayName: "Trap OIDs"
            graphChartConfig:
              metrics:
                - metricSelector: "com.dynatrace.extension.snmp-traps-generic.traps.count:splitBy(\
                    \"trapoid\")"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-traps-generic.traps\
                    .count`),by:{trapoid}"
                  visualization:
                    seriesType: "COLUMN"
              stacked: true
              yAxes: []
            visualizationType: "GRAPH_CHART"
        conditions: []
        displayName: "Traps Statistics"
        numberOfVisibleCharts: 2
      - key: "network_stats"
        target: "BOTH"
        mode: "NORMAL"
        displayName: "Network Statistics"
        description: "Populated from IF-MIB"
        hideEmptyCharts: true
        numberOfVisibleCharts: 4
        chartsInRow: 2
        charts:
          - displayName: "Network Interfaces Traffic"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-vi\
                ptela-device.if.hc.out.octets.count:filter(in(\"dt.entity.snmp:\
                com_dynatrace_extension_snmp_generic_viptela_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.hc\
                    .out.octets.bitpersec:splitBy()"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-viptela-dev\
                    ice.if.hc.out.octets.count`),

                    \ 
                    by:{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_vi\
                    ptela_device`},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_viptela_device`==$(entityId)}

                    \  | fieldsAdd expression=count[]*8/toDouble(interval/1s)

                    \  | fieldsRemove count

                    \  | summarize
                    expression=sum(expression[]),interval=takeAny(interval),tim\
                    eframe=takeAny(timeframe), by:{}\n"
                  visualization:
                    displayName: "Interface outgoing traffic (high capacity)"
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.hc\
                    .in.octets.bitpersec:splitBy()"
                  dqlQuery: "timeseries
                    count=sum(`com.dynatrace.extension.snmp-generic-viptela-dev\
                    ice.if.hc.in.octets.count`),

                    \ 
                    by:{`dt.entity.snmp:com_dynatrace_extension_snmp_generic_vi\
                    ptela_device`},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_viptela_device`==$(entityId)}

                    \  | fieldsAdd expression=count[]*8/toDouble(interval/1s)

                    \  | fieldsRemove count

                    \  | summarize
                    expression=sum(expression[]),interval=takeAny(interval),tim\
                    eframe=takeAny(timeframe), by:{}\n"
                  visualization:
                    displayName: "Interface incoming traffic (high capacity)"
          - displayName: "Interfaces Bandwidth Utilization"
            conditions:
              - "metricAvailable|metric=com.dynatrace.extension.snmp-generic-vi\
                ptela-device.if.hc.in.octets.count:filter(in(\"dt.entity.snmp:c\
                om_dynatrace_extension_snmp_generic_viptela_device\",
                entitySelector(\"entityId($(entityId))\")))|lastWrittenWithinDa\
                ys=5"
            visualizationType: "GRAPH_CHART"
            graphChartConfig:
              metrics:
                - metricSelector: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.ba\
                    ndwidth:splitBy()"
                  dqlQuery: "timeseries
                    in.octets.count=sum(`com.dynatrace.extension.snmp-generic-v\
                    iptela-device.if.hc.in.octets.count`),out.octets.count=sum(\
                    `com.dynatrace.extension.snmp-generic-viptela-device.if.hc.\
                    out.octets.count`),highspeed=avg(`com.dynatrace.extension.s\
                    nmp-generic-viptela-device.if.highspeed`),

                    \ 
                    by:{if.operstatus,sys.contact,device.address,`dt.entity.snm\
                    p:com_dynatrace_extension_snmp_generic_viptela_network_inte\
                    rface`,dt.metrics.source,if.speed,device.port,if.idx,if.hig\
                    hspeed,if.type,`dt.entity.snmp:com_dynatrace_extension_snmp\
                    _generic_viptela_device`,if.descr,device.name,if.adminstatu\
                    s,device,if.mtu,if.promiscuousmode,sys.name},

                    \ 
                    filter:{`dt.entity.snmp:com_dynatrace_extension_snmp_generi\
                    c_viptela_device`==$(entityId)}

                    \  | fieldsAdd
                    expression=(((in.octets.count[]*8)+(out.octets.count[]*8))/\
                    (highspeed[]*1000000))*100/toDouble(interval/1s)

                    \  | fieldsRemove in.octets.count,out.octets.count,highspeed

                    \  | summarize
                    expression=sum(expression[]),interval=takeAny(interval),tim\
                    eframe=takeAny(timeframe), by:{}\n"
                  visualization:
                    displayName: "Interface bandwidth utilization"
