name: "custom:viptela-networks"
minDynatraceVersion: "1.303.0"
author:
  name: "Custom Extensions Creator App"
version: "1.0.10"
vars:
  - id: "ext.activationtag"
    displayName: "Extension activation tag"
    type: "text"
  - id: "if_name"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Name"
    maxLength: 5000
  - id: "if_admin_status"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Admin Status"
    maxLength: 5000
  - id: "if_oper_status"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Operational Status"
    maxLength: 5000
  - id: "if_alias"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Alias"
    maxLength: 5000
  - id: "if_type"
    type: "text"
    displayName: "Pattern to filter capturing of Interfaces by Type"
    maxLength: 5000
metrics:
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.entity_attributes"
    metadata:
      displayName: "Device entity attributes"
      description: "Constant value of 1 used for reporting entity attributes at a
        lower frequency"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "com.dynatrace.extension.network_device.cpu_usage"
    metadata:
      displayName: "CPU Usage"
      description: "CPU utilization percentage for user processes"
      unit: "Percent"
      sourceEntityType: "network:device"
  - key: "com.dynatrace.extension.network_device.memory_used"
    metadata:
      displayName: "Memory Used"
      description: "Total memory currently in use"
      unit: "KiloByte"
      sourceEntityType: "network:device"
  - key: "com.dynatrace.extension.network_device.memory_total"
    metadata:
      displayName: "Memory Total"
      description: "Total memory installed"
      unit: "KiloByte"
      sourceEntityType: "network:device"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.cpu.user"
    metadata:
      displayName: "CPU User"
      description: "CPU utilization percentage for user processes"
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.cpu.system"
    metadata:
      displayName: "CPU System"
      description: "CPU utilization percentage for system processes"
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.cpu.idle"
    metadata:
      displayName: "CPU Idle"
      description: "CPU idle percentage"
      unit: "Percent"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.cpu.total"
    query:
      metricSelector: "(100) - (com.dynatrace.extension.snmp-generic-viptela-device.cpu.idle)"
    metadata:
      displayName: "CPU Utilization Total"
      description: "Total CPU utilization percentage (100 - idle)"
      unit: "Percent"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.memory.total"
    metadata:
      displayName: "Memory Total"
      description: "Total memory installed (in KB)"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.memory.used"
    metadata:
      displayName: "Memory Used"
      description: "Total memory currently in use (in KB)"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.memory.free"
    metadata:
      displayName: "Memory Free"
      description: "Total memory available (in KB)"
      unit: "KiloByte"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.memory.utilizati\
      on"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-viptela-device.memory.u\
        sed) /
        (com.dynatrace.extension.snmp-generic-viptela-device.memory.total)) *
        (100)"
    metadata:
      displayName: "Memory Utilization"
      description: "Memory utilization percentage"
      unit: "Percent"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.sys.uptime"
    metadata:
      displayName: "Time since the last re-start"
      description: "The time (in hundredths of a second) since the network management
        portion of the system was last re-initialized"
      unit: "Unspecified"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_device"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.sys.uptime.milli\
      s"
    query:
      metricSelector: "(com.dynatrace.extension.snmp-generic-viptela-device.sys.uptime) * (10)"
    metadata:
      displayName: "Time since the last re-start"
      description: "The time (in milliseconds) since the network management portion of
        the system was last re-initialized"
      unit: "MilliSecond"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.lastchange"
    metadata:
      displayName: "Last interface status change"
      description: "Value of 'sysUpTime' when the interface entered its current state"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.in.octets.count"
    metadata:
      displayName: "Octets received"
      description: "The total number of octets received on the interface including
        framing characters"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.hc.in.octets.count"
    metadata:
      displayName: "Octets received (high capacity)"
      description: "The total number of octets received on the interface including
        framing characters. This metric uses 64 bit counter and should be used
        for highspeed devices."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.in.errors.count"
    metadata:
      displayName: "Inbound errors"
      description: "Number of inbound packets/transmission units with errors"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.in.discards.count"
    metadata:
      displayName: "Inbound discards"
      description: "Number of inbound packets discarded"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.out.octets.count"
    metadata:
      displayName: "Octets transmitted"
      description: "The total number of octets transmitted out of the interface
        including framing characters"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.hc.out.octets.coun\
      t"
    metadata:
      displayName: "Octets transmitted (high capacity)"
      description: "The total number of octets transmitted out of the interface
        including framing characters. This metric uses 64 bit counter and should
        be used for highspeed devices."
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.out.errors.count"
    metadata:
      displayName: "Outbound errors"
      description: "Number of outbound packets/transmission units with errors"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.out.discards.count"
    metadata:
      displayName: "Outbound discards"
      description: "Number of outbound packets discarded"
      unit: "Count"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "com.dynatrace.extension.snmp-generic-viptela-device.if.highspeed"
    metadata:
      displayName: "Interface speed"
      description: "Speed of the network interface in MegaBits per second."
      unit: "MegaBitPerSecond"
      sourceEntityType: "snmp:com_dynatrace_extension_snmp_generic_viptela_network_interface"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.in.octets.bit\
      persec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-viptela-device.if.in.oc\
        tets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface incoming traffic"
      description: "Incoming network traffic on interface in bits per second."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.hc.in.octets.\
      bitpersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-viptela-device.if.hc.in\
        .octets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface incoming traffic (high capacity)"
      description: "Incoming network traffic on interface in bits per second. This
        metric uses high capacity octet metrics and should be used for highspeed
        devices."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.out.octets.bi\
      tpersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-viptela-device.if.out.o\
        ctets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface outgoing traffic"
      description: "Outgoing network traffic on interface in bits per second."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.hc.out.octets\
      .bitpersec"
    query:
      metricSelector: "((com.dynatrace.extension.snmp-generic-viptela-device.if.hc.ou\
        t.octets.count) * (8)):rate(1s)"
    metadata:
      displayName: "Interface outgoing traffic (high capacity)"
      description: "Outgoing network traffic on interface in bits per second. This
        metric uses high capacity octet metrics and should be used for highspeed
        devices."
      unit: "BitPerSecond"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.bandwidth"
    query:
      metricSelector: "((((((com.dynatrace.extension.snmp-generic-viptela-device.if.h\
        c.in.octets.count) *
        (8)):rate(1s))+(((com.dynatrace.extension.snmp-generic-viptela-device.i\
        f.hc.out.octets.count) *
        (8)):rate(1s)))/((com.dynatrace.extension.snmp-generic-viptela-device.i\
        f.highspeed) * 1000000)) * (100))"
    metadata:
      displayName: "Interface bandwidth utilization"
      description: "Bandwidth utilization on interface. Computed as sum of incoming
        and outgoing traffic divided by interface speed. Presented as
        percentage."
      unit: "Percent"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.in.bandwidth"
    query:
      metricSelector: "(((((com.dynatrace.extension.snmp-generic-viptela-device.if.hc\
        .in.octets.count) *
        (8)):rate(1s))/((com.dynatrace.extension.snmp-generic-viptela-device.if\
        .highspeed) * (1000000))) * (100))"
    metadata:
      displayName: "Inbound bandwidth utilization"
      description: "Inbound bandwidth utilization on interface. Computed as sum of
        incoming traffic divided by interface speed. Presented as percentage."
      unit: "Percent"
  - key: "func:com.dynatrace.extension.snmp-generic-viptela-device.if.out.bandwidth"
    query:
      metricSelector: "(((((com.dynatrace.extension.snmp-generic-viptela-device.if.hc\
        .out.octets.count) *
        (8)):rate(1s))/((com.dynatrace.extension.snmp-generic-viptela-device.if\
        .highspeed) * (1000000))) * (100))"
    metadata:
      displayName: "Outbound bandwidth utilization"
      description: "Outbound bandwidth utilization on interface. Computed as sum of
        outgoing traffic divided by interface speed. Presented as percentage."
      unit: "Percent"
snmp:
  - group: "generic-viptela-device-attributes"
    interval:
      minutes: 30
    dimensions:
      - key: "sys.name"
        value: "oid:1.3.6.1.2.1.1.5.0"
      - key: "sys.contact"
        value: "oid:1.3.6.1.2.1.1.4.0"
      - key: "activation.tag"
        value: "var:ext.activationtag"
      - key: "device.port"
        value: "this:device.port"
      - key: "lldp.chassis.id"
        value: "$inetAddress(oid:1.0.8802.1.1.2.1.3.1.0, oid:1.0.8802.1.1.2.1.3.2.0)"
    subgroups:
      - subgroup: "Device Info for entity attributes"
        table: false
        dimensions:
          - key: "sys.description"
            value: "oid:1.3.6.1.2.1.1.1.0"
          - key: "sys.objectid"
            value: "oid:1.3.6.1.2.1.1.2.0"
          - key: "sys.location"
            value: "oid:1.3.6.1.2.1.1.6.0"
          - key: "monitoring.mode"
            value: "const:Extension"
          - key: "device.type"
            value: "const:viptela"
          - key: "sys.services"
            value: "oid:1.3.6.1.2.1.1.7.0"
          - key: "if.count"
            value: "oid:1.3.6.1.2.1.2.1.0"
          - key: "software_version"
            value: "oid:1.3.6.1.4.1.41916.11.1.2"
        metrics:
          - key: "com.dynatrace.extension.snmp-generic-viptela-device.entity_attributes"
            value: "const:1"
        interval:
          minutes: 30
  - group: "generic-network-topology"
    interval:
      minutes: 10
    dimensions:
      - key: "sys.name"
        value: "oid:1.3.6.1.2.1.1.5.0"
      - key: "lldp.chassis.id"
        value: "$inetAddress(oid:1.0.8802.1.1.2.1.3.1.0, oid:1.0.8802.1.1.2.1.3.2.0)"
    subgroups:
      - subgroup: "neighbor-discovery"
        featureSet: "neighbor-discovery"
        table: true
        dimensions:
          - key: "neighbor.chassis.id"
            value: "$inetAddress(oid:1.0.8802.1.1.2.1.4.1.1.4,
              oid:1.0.8802.1.1.2.1.4.1.1.5)"
          - key: "neighbor.chassistype"
            value: "oid:1.0.8802.1.1.2.1.4.1.1.4"
          - key: "neighbor.port.id"
            value: "$inetAddress(oid:1.0.8802.1.1.2.1.4.1.1.6,
              oid:1.0.8802.1.1.2.1.4.1.1.7)"
          - key: "neighbor.porttype"
            value: "oid:1.0.8802.1.1.2.1.4.1.1.6"
          - key: "neighbor.port.desc"
            value: "oid:1.0.8802.1.1.2.1.4.1.1.8"
          - key: "neighbor.sys.name"
            value: "oid:1.0.8802.1.1.2.1.4.1.1.9"
          - key: "neighbor.sys.desc"
            value: "oid:1.0.8802.1.1.2.1.4.1.1.10"
          - key: "neighbor.cap.support"
            value: "oid:1.0.8802.1.1.2.1.4.1.1.11"
          - key: "neighbor.cap.enabled"
            value: "oid:1.0.8802.1.1.2.1.4.1.1.12"
        metrics:
          - key: "com.dynatrace.extension.network_device.lldp_neighbor"
            value: "const:1"
        interval:
          minutes: 10
      - subgroup: "Uptime"
        dimensions:
          - key: "sys.description"
            value: "oid:1.3.6.1.2.1.1.1.0"
          - key: "sys.contact"
            value: "oid:1.3.6.1.2.1.1.4.0"
          - key: "sys.objectid"
            value: "oid:1.3.6.1.2.1.1.2.0"
          - key: "sys.location"
            value: "oid:1.3.6.1.2.1.1.6.0"
          - key: "monitoring.mode"
            value: "const:Extension"
          - key: "device.type"
            value: "const:viptela"
        metrics:
          - key: "com.dynatrace.extension.network_device.sysuptime"
            value: "oid:1.3.6.1.2.1.1.3.0"
        interval:
          minutes: 10
      - subgroup: "Network device CPU and Memory"
        table: false
        metrics:
          - key: "com.dynatrace.extension.network_device.cpu_usage"
            value: "oid:1.3.6.1.4.1.41916.11.1.14.0"
            type: "gauge"
          - key: "com.dynatrace.extension.network_device.memory_used"
            value: "oid:1.3.6.1.4.1.41916.11.1.18.0"
            type: "gauge"
          - key: "com.dynatrace.extension.network_device.memory_free"
            value: "oid:1.3.6.1.4.1.41916.11.1.19.0"
            type: "gauge"
          - key: "com.dynatrace.extension.network_device.memory_total"
            value: "oid:1.3.6.1.4.1.41916.11.1.17.0"
            type: "gauge"
        interval:
          minutes: 10
      - subgroup: "Network interface"
        table: true
        dimensions:
          - key: "if.name"
            value: "oid:1.3.6.1.2.1.2.2.1.2"
            filter: "var:if_name"
          - key: "if.type"
            value: "oid:1.3.6.1.2.1.2.2.1.3"
            filter: "var:if_type"
          - key: "oper.status"
            value: "oid:1.3.6.1.2.1.2.2.1.8"
            filter: "var:if_oper_status"
          - key: "admin.status"
            value: "oid:1.3.6.1.2.1.2.2.1.7"
            filter: "var:if_admin_status"
          - key: "if.alias"
            value: "oid:1.3.6.1.2.1.31.1.1.1.18"
            filter: "var:if_alias"
          - key: "mac.address"
            value: "oid:1.3.6.1.2.1.2.2.1.6"
          - key: "if.speed"
            value: "oid:1.3.6.1.2.1.31.1.1.1.15"
        metrics:
          - key: "com.dynatrace.extension.network_device.if.bytes_in.count"
            value: "oid:1.3.6.1.2.1.31.1.1.1.6"
            type: "count"
          - key: "com.dynatrace.extension.network_device.if.bytes_out.count"
            value: "oid:1.3.6.1.2.1.31.1.1.1.10"
            type: "count"
          - key: "com.dynatrace.extension.network_device.if.in.errors.count"
            value: "oid:1.3.6.1.2.1.2.2.1.14"
            type: "count"
          - key: "com.dynatrace.extension.network_device.if.in.discards.count"
            value: "oid:1.3.6.1.2.1.2.2.1.13"
            type: "count"
          - key: "com.dynatrace.extension.network_device.if.out.errors.count"
            value: "oid:1.3.6.1.2.1.2.2.1.20"
            type: "count"
          - key: "com.dynatrace.extension.network_device.if.out.discards.count"
            value: "oid:1.3.6.1.2.1.2.2.1.19"
            type: "count"
          - key: "com.dynatrace.extension.network_device.if.status"
            value: "const:1"
        interval:
          minutes: 10
  - group: "viptela-device-data"
    featureSet: "Control Plane"
    interval:
      minutes: 10
    dimensions:
      - key: "sys.name"
        value: "oid:1.3.6.1.2.1.1.5.0"
      - key: "sys.contact"
        value: "oid:1.3.6.1.2.1.1.4.0"
      - key: "activation.tag"
        value: "var:ext.activationtag"
      - key: "device.port"
        value: "this:device.port"
      - key: "device.type"
        value: "const:viptela"
      - key: "monitoring.mode"
        value: "const:Extension"
      - key: "lldp.chassis.id"
        value: "$inetAddress(oid:1.0.8802.1.1.2.1.3.1.0, oid:1.0.8802.1.1.2.1.3.2.0)"
    metrics:
      - key: "com.dynatrace.extension.snmp-generic-viptela-device.sys.uptime"
        value: "oid:1.3.6.1.2.1.1.3.0"
        type: "gauge"
    subgroups:
      - subgroup: "Viptela CPU & Memory"
        featureSet: "Control Plane"
        table: false
        metrics:
          - key: "com.dynatrace.extension.snmp-generic-viptela-device.cpu.user"
            value: "oid:1.3.6.1.4.1.41916.11.1.14.0"
            type: "gauge"
          - key: "com.dynatrace.extension.snmp-generic-viptela-device.cpu.system"
            value: "oid:1.3.6.1.4.1.41916.11.1.15.0"
            type: "gauge"
          - key: "com.dynatrace.extension.snmp-generic-viptela-device.cpu.idle"
            value: "oid:1.3.6.1.4.1.41916.11.1.16.0"
            type: "gauge"
          - key: "com.dynatrace.extension.snmp-generic-viptela-device.memory.total"
            value: "oid:1.3.6.1.4.1.41916.11.1.17.0"
            type: "gauge"
          - key: "com.dynatrace.extension.snmp-generic-viptela-device.memory.used"
            value: "oid:1.3.6.1.4.1.41916.11.1.18.0"
            type: "gauge"
          - key: "com.dynatrace.extension.snmp-generic-viptela-device.memory.free"
            value: "oid:1.3.6.1.4.1.41916.11.1.19.0"
            type: "gauge"
        interval:
          minutes: 10
      - subgroup: "NIC status"
        featureSet: "Interfaces"
        table: true
        dimensions:
          - key: "if.idx"
            value: "oid:1.3.6.1.2.1.2.2.1.1"
          - key: "if.descr"
            value: "oid:1.3.6.1.2.1.2.2.1.2"
            filter: "var:if_name"
          - key: "if.type"
            value: "oid:1.3.6.1.2.1.2.2.1.3"
            filter: "var:if_type"
          - key: "if.mtu"
            value: "oid:1.3.6.1.2.1.2.2.1.4"
          - key: "if.speed"
            value: "oid:1.3.6.1.2.1.2.2.1.5"
          - key: "if.highspeed"
            value: "oid:1.3.6.1.2.1.31.1.1.1.15"
          - key: "if.adminstatus"
            value: "oid:1.3.6.1.2.1.2.2.1.7"
            filter: "var:if_admin_status"
          - key: "if.operstatus"
            value: "oid:1.3.6.1.2.1.2.2.1.8"
            filter: "var:if_oper_status"
          - key: "if.promiscuousmode"
            value: "oid:1.3.6.1.2.1.31.1.1.1.16"
          - key: "if.alias"
            value: "oid:1.3.6.1.2.1.31.1.1.1.18"
            filter: "var:if_alias"
          - key: "if.name"
            value: "oid:1.3.6.1.2.1.31.1.1.1.1"
          - key: "mac.address"
