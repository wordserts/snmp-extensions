topology:
  types:
    - name: "network:device"
      displayName: "Network device"
      enabled: true
      rules:
        - idPattern: "network_device_{device.address}"
          sources:
            - sourceType: "Metrics"
              condition: "$eq(com.dynatrace.extension.snmp-generic-viptela-device.sys.uptime)"
          attributes:
            - key: "dt.ip_addresses"
              pattern: "{device.address}"
              displayName: "IP Address"
            - key: "dt.listen_ports"
              pattern: "{device.port}"
              displayName: "Listen Port"
            - key: "dt.dns_names"
              pattern: "{device.name}"
              displayName: "DNS Names"
            - key: "devType"
              pattern: "{device.type}"
              displayName: "Device Type"
            - key: "devMonitoringMode"
              pattern: "{monitoring.mode}"
              displayName: "Monitoring Mode"
            - key: "lldpChassisId"
              pattern: "{lldp.chassis.id}"
              displayName: "LLDP Chassis ID"
            - key: "devSysContact"
              pattern: "{sys.contact}"
              displayName: "Contact"
            - key: "dt.security_context"
              pattern: "{dt.security_context}"
              displayName: "Security Context"
          requiredDimensions:
            - key: "device.name"
            - key: "device.address"
            - key: "device.type"
            - key: "lldp.chassis.id"
          instanceNamePattern: "{sys.name}"
        - idPattern: "network_device_{device.address}"
          sources:
            - sourceType: "Metrics"
              condition: "$eq(com.dynatrace.extension.snmp-generic-viptela-device.entity_attr\
                ibutes)"
          attributes:
            - key: "dt.dns_names"
              pattern: "{sys.name}"
              displayName: "DNS Names"
            - key: "devDescription"
              pattern: "{sys.description}"
              displayName: "Description"
            - key: "devSysLocation"
              pattern: "{sys.location}"
              displayName: "Location"
            - key: "devObjectId"
              pattern: "{sys.objectid}"
              displayName: "Object ID"
            - key: "interface_count"
              pattern: "{if.count}"
              displayName: "Interface Count"
            - key: "dt.security_context"
              pattern: "{dt.security_context}"
              displayName: "Security Context"
          requiredDimensions:
            - key: "sys.name"
            - key: "sys.description"
          instanceNamePattern: "{sys.name}"
        - idPattern: "network_device_{device.address}"
          sources:
            - sourceType: "Metrics"
              condition: "$prefix(com.dynatrace.extension.snmp-generic-viptela-device)"
          attributes:
            - key: "dt.security_context"
              pattern: "{dt.security_context}"
              displayName: "Security Context"
          requiredDimensions: []
          instanceNamePattern: "{sys.name}"
    - name: "network:interface"
      displayName: "Network interface"
